# dev branch: pull requests into dev run the checks; a merge (push) into dev runs them again and, if they
# pass, deploys the API to the server with deploy/deploy.sh. See deploy/README.md ("CI/CD").
name: dev

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# One deploy at a time, in merge order (never cancel a deploy halfway).
concurrency:
  group: dev-${{ github.event_name == 'push' && 'deploy' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'   # same as the server; composer.lock needs >= 8.4.1
          extensions: mbstring, intl, bcmath, gd, zip, pdo_sqlite
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: App key
        run: cp .env.example .env && php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: SSH key for the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Secret DEPLOY_SSH_KEY is empty: add it to the repo's dev environment (deploy/README.md, CI/CD)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp deploy/known_hosts ~/.ssh/known_hosts

      - name: Deploy
        run: ./deploy/deploy.sh

      - name: Health check
        run: curl -fsS -o /dev/null -w '%{http_code}\n' https://api.rentflow.codepasstech.top/up
