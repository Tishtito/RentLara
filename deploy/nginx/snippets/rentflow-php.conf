# Send the request to Laravel (backend/public/index.php) through PHP-FPM.
# Used by the API host for every PHP request, and by the admin / tenant hosts for /api/ and /sanctum/
# (the browser apps call the API on their own origin, so cookie login needs no CORS).
fastcgi_pass unix:/run/php/php8.4-fpm.sock;      # the server's CLI is PHP 8.4 too (queue worker, artisan)
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /home/tito/rentflow/backend/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /home/tito/rentflow/backend/public;
fastcgi_param REQUEST_URI $request_uri;
fastcgi_param HTTPS $https if_not_empty;
fastcgi_param HTTP_PROXY "";                      # httpoxy
fastcgi_read_timeout 120s;
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
