# Shared by all three Rentflow hosts.
charset utf-8;
client_max_body_size 20m;            # meter-reading photos, uploads
server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/manifest+json;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# After HTTPS works for all three names, uncomment (browsers will refuse plain http for a year):
# add_header Strict-Transport-Security "max-age=31536000" always;

# Let's Encrypt HTTP challenge (certbot --nginx answers it automatically).
location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    default_type text/plain;
}

# Never serve dotfiles (.env, .git…).
location ~ /\.(?!well-known) {
    deny all;
}
