# api.rentflow.codepasstech.top: the Laravel API (mobile apps, /docs in staging, WhatsApp webhooks, links
# built from APP_URL). The web apps reach the same backend through /api/ on their own hosts.
#
# This block listens on port 80 only. `certbot --nginx` adds the HTTPS (443) part and the http → https
# redirect to it (see README.md).
server {
    listen 80;
    listen [::]:80;
    server_name api.rentflow.codepasstech.top;

    root /home/tito/rentflow/backend/public;
    index index.php;

    include snippets/rentflow-common.conf;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/rentflow-api.access.log;
    error_log  /var/log/nginx/rentflow-api.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Uploaded files (php artisan storage:link).
    location /storage/ {
        expires 7d;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/rentflow-php.conf;
    }
}
